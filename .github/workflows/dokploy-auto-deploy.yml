name: Dokploy Auto Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy deployment
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
          DEPLOY_TITLE: GitHub auto deploy
          DEPLOY_DESCRIPTION: repo=${{ github.repository }} ref=${{ github.ref_name }} sha=${{ github.sha }}
        run: |
          set -euo pipefail

          payload="$(
            jq -nc \
              --arg applicationId "$DOKPLOY_APPLICATION_ID" \
              --arg title "$DEPLOY_TITLE" \
              --arg description "$DEPLOY_DESCRIPTION" \
              '{json:{applicationId:$applicationId,title:$title,description:$description}}'
          )"

          curl --fail-with-body -sS \
            -X POST "${DOKPLOY_URL%/}/api/trpc/application.deploy" \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -H "content-type: application/json" \
            --data "$payload"
